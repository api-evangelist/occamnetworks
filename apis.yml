name: Occamnetworks
description: 'Occam Networks was a broadband access equipment vendor that developed and marketed
  systems enabling telecommunications carriers to profitably deliver emerging voice, video, and
  high-speed data (triple-play) services over copper and fiber, including its BLC 6000 access
  platform and ONT/ONU customer-premises hardware. The company was acquired by Calix in early 2011
  and no longer operates independently. The occamnetworks.com domain currently serves an archived
  circa-2010 marketing site (products, solutions, support, news, whitepapers) with no developer
  program, API, SDK, or documentation surface. Enrichment found no API artifacts to harvest.'
